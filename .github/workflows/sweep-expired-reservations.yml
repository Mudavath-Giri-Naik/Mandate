# Releases stock held by abandoned checkouts.
#
# Why this exists: Vercel's Hobby plan allows one cron job at most once per day,
# so vercel.json is set to a daily sweep. That is too slow to be the only safety
# net — a customer who closes their tab mid-payment would hold the last unit for
# up to 24 hours. GitHub Actions gives us a 10-minute sweep for free.
#
# The common case does not depend on either: when a customer dismisses the
# Razorpay widget the browser calls /api/orders/verify with { failed: true } and
# the unit is released immediately. This job only catches the stragglers — a
# closed laptop, a dropped connection, a killed tab.
#
# ── Setup ────────────────────────────────────────────────────────────────────
# Repo → Settings → Secrets and variables → Actions → New repository secret:
#
#   APP_URL      https://your-app.vercel.app     (no trailing slash)
#   CRON_SECRET  the same value set in Vercel's environment variables
#
# Until both secrets exist the job exits cleanly with a note rather than failing,
# so a fresh clone does not show a red X.
#
# Note: GitHub's scheduler is best-effort. Under load a */10 schedule can slip by
# several minutes, and schedules are paused on repos with no activity for 60
# days. Fine for a safety net; do not treat it as a hard guarantee.

name: Sweep expired reservations

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # lets you trigger it by hand from the Actions tab

concurrency:
  # Never let two sweeps overlap. The SQL function is safe against that anyway
  # (it claims rows by flipping status before crediting stock), but there is no
  # reason to make it prove that every ten minutes.
  group: sweep-expired-reservations
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Release abandoned reservations
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret is not set — nothing to sweep yet. Skipping."
            exit 0
          fi

          echo "Sweeping ${APP_URL}/api/orders/cancel-expired"

          # -f is deliberately NOT used: we want the body on a non-2xx so the
          # log shows *why* it failed, not just that it did.
          response=$(curl -sS -w '\n%{http_code}' \
            -X GET "${APP_URL}/api/orders/cancel-expired" \
            -H "Authorization: Bearer ${CRON_SECRET}")

          status=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')

          echo "HTTP $status"
          echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::Sweep failed with HTTP $status"
            exit 1
          fi

          count=$(printf '%s' "$body" | grep -o '"cancelled_count":[0-9]*' | grep -o '[0-9]*$')
          echo "::notice::Released ${count:-0} abandoned reservation(s)"
